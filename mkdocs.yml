site_name: Danny 的教學庫
site_description: APCS、TQC Python 與 ZeroJudge 程式設計教材
site_url: https://danny-owo.github.io/teaching_material/
repo_url: https://github.com/Danny-OWO/teaching_material
repo_name: Danny-OWO/teaching_material

docs_dir: .mkdocs-docs
site_dir: site
use_directory_urls: true

# Generated problem pages are linked from their source indexes. This keeps a
# newly pushed solution deployable even before it is added to the sidebar.
not_in_nav: |
  APCS/*.md
  codecat/*.md
  ZeroJudge/*/index.md
  TQC python/*/index.md

theme:
  name: material
  language: zh-TW
  logo: assets/media/danny-profile.jpg
  font: false
  palette:
    scheme: slate
    primary: blue grey
    accent: cyan
  features:
    - navigation.top
    - toc.follow
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search:
      lang:
        - zh
        - en

extra_css:
  - https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap
  - assets/stylesheets/extra.css?v=alphabet-index-1

extra_javascript:
  - assets/javascripts/background-video.js
  - assets/javascripts/source-filter.js?v=alphabet-index-1
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 首頁: index.md
  - APCS 課程: APCS/index.md
  - CodeCat: codecat/index.md
  - ZeroJudge 題解: ZeroJudge/index.md
  - TQC Python: TQC python/index.md
